all:
  children:
    proxmox:
      hosts:
        r42-proxmox:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
    proxmox_cli:
      hosts:
        r42-proxmox-cli:
          ansible_host: "{{ r42_proxmox_address }}"
          ansible_user: "{{ r42_proxmox_ssh_user }}"
          ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ deployer_cli_user_ssh_known_hosts | quote }}
    scenario_guests:
      hosts:
        workstation-8d4b18f26b61:
          ansible_host: 10.42.10.11
          ansible_user: alice
          ansible_ssh_common_args: -o ProxyCommand={{ ("ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=" ~ (deployer_cli_user_ssh_known_hosts | quote) ~ " -W %h:%p " ~ ((r42_proxmox_ssh_user ~ "@" ~ r42_proxmox_address) | quote)) | quote }} -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ deployer_cli_user_ssh_known_hosts | quote }}
        workstation-f41ec66e19c3:
          ansible_host: 10.42.10.12
          ansible_user: alice
          ansible_ssh_common_args: -o ProxyCommand={{ ("ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=" ~ (deployer_cli_user_ssh_known_hosts | quote) ~ " -W %h:%p " ~ ((r42_proxmox_ssh_user ~ "@" ~ r42_proxmox_address) | quote)) | quote }} -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ deployer_cli_user_ssh_known_hosts | quote }}
        workstation-982df81e340f:
          ansible_host: 10.42.11.11
          ansible_user: alice
          ansible_ssh_common_args: -o ProxyCommand={{ ("ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=" ~ (deployer_cli_user_ssh_known_hosts | quote) ~ " -W %h:%p " ~ ((r42_proxmox_ssh_user ~ "@" ~ r42_proxmox_address) | quote)) | quote }} -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ deployer_cli_user_ssh_known_hosts | quote }}
