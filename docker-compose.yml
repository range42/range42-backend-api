services:
  api:
    image: ${RANGE42_CONTAINER_IMAGE:-range42-backend-api:local}
    build:
      context: .
      target: runtime
      args:
        APP_UID: ${RANGE42_CONTAINER_UID:-1000}
        APP_GID: ${RANGE42_CONTAINER_GID:-1000}
    # Explicitly single-process; do not scale against the same SQLite workspace.
    init: true
    ports:
      - "${RANGE42_LISTEN_ADDRESS:-127.0.0.1}:${RANGE42_CONTAINER_PORT:-8000}:8000"
    volumes:
      - state:/var/lib/range42
    secrets:
      - api_token
      - credential_key
    environment:
      RANGE42_AUTH_MODE: required
      RANGE42_API_TOKEN_FILE: /run/secrets/api_token
      RANGE42_CREDENTIAL_KEY_FILE: /run/secrets/credential_key
      RANGE42_CORS_ORIGINS: ${RANGE42_CORS_ORIGINS:-}
      RANGE42_GIT_ALLOWED_HOSTS: ${RANGE42_GIT_ALLOWED_HOSTS:-github.com,gitlab.com,codeberg.org}
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  state:

secrets:
  api_token:
    file: ${RANGE42_CONTAINER_SECRETS_DIR:-./.container-secrets}/api-token
  credential_key:
    file: ${RANGE42_CONTAINER_SECRETS_DIR:-./.container-secrets}/credential-key
