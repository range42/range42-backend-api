name: CI
on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**', 'feature/**', 'chore/**']
  pull_request:
    branches: [main, dev]
jobs:
  lint-and-test:
    name: Ruff + Pytest
    runs-on: ubuntu-latest
    container:
      # Check Python 3.13 compatibility; Docker and the shared host use 3.12.
      image: python:3.13-slim
    steps:
      # git: the suite builds throwaway repos to exercise the project checkout.
      # openssh-client: ssh-keygen/ssh-agent/ssh-add back the ssh_agent tests.
      - run: |
          apt-get update && apt-get install -y --no-install-recommends \
            git openssh-client zsh jq yq
      - uses: actions/checkout@v6
      - run: pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
      - run: ruff check app/ tests/
      - name: Checkout reviewed native playbooks contract
        uses: actions/checkout@v6
        with:
          repository: range42/range42-playbooks
          ref: 6dcf31b5b53600f41be1ce7553d489dba4ad803b
          path: runtime-contract/playbooks
      - name: Checkout reviewed native controller contract
        uses: actions/checkout@v6
        with:
          repository: range42/range42-ansible_roles-proxmox_controller
          ref: 617b57cddecbe4ddedd1f72becc7023bbcdf2114
          path: runtime-contract/controller
      # tests/overlay runs the TS/Python parity vectors, which live in the
      # sibling range42-deployer-ui checkout — schema-and-operators.yml owns
      # that job and guarantees the checkout. Collecting them here would fail,
      # since tests/overlay/conftest.py deliberately fails rather than skips
      # when the vectors are missing and CI is set.
      - run: pytest --tb=short -q --ignore=tests/overlay
        env:
          RANGE42_NATIVE_CONTRACT_FIXTURE: ${{ github.workspace }}/runtime-contract

      # The committed spec bootstraps the Kong gateway config, but nothing
      # regenerated or verified it — it had rotted back to the pre-v1 API
      # (84 paths, zero /v1) before #115. Generation is deterministic and
      # independent of these paths; they only satisfy import-time reads.
      - name: OpenAPI drift check
        env:
          # Schema generation imports the app without starting a service.
          RANGE42_AUTH_MODE: development
          PROJECT_ROOT_DIR: ${{ github.workspace }}
          API_BACKEND_WWWAPP_PLAYBOOKS_DIR: ${{ github.workspace }}
          API_BACKEND_PUBLIC_PLAYBOOKS_DIR: ${{ github.workspace }}
          API_BACKEND_INVENTORY_DIR: ${{ github.workspace }}/inventory
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
          import json
          from app.main import create_app
          print(json.dumps(create_app().openapi(), indent=2))
          " > /tmp/openapi.check.json
          diff -u openapi.json /tmp/openapi.check.json \
            || { echo "::error::openapi.json is out of date — regenerate it (see README) and commit"; exit 1; }
