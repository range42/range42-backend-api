[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///%(here)s/.alembic-scratch.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
